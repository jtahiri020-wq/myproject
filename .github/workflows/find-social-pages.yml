name: البحث عن صفحات فيسبوك وانستغرام

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "مسار ملف CSV داخل المستودع (مثال: مشاريعي.csv)"
        required: true
        default: "مشاريعي.csv"
      name_column:
        description: "اسم عمود اسم المشروع"
        required: true
        default: "اسم_المشروع"
      city_column:
        description: "اسم عمود المدينة"
        required: true
        default: "المدينة"
      facebook_column:
        description: "اسم العمود الأصلي لروابط فيسبوك (سيُملأ فيه فقط الناقص)"
        required: true
        default: "فيسبوك"
      instagram_column:
        description: "اسم العمود الأصلي لروابط انستغرام (سيُملأ فيه فقط الناقص)"
        required: true
        default: "انستغرام"
      delay:
        description: "ثواني الانتظار بين كل بحث (لا تقل عن 1)"
        required: false
        default: "3"

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تشغيل SearXNG
        run: |
          docker run -d --name searxng \
            -p 8080:8080 \
            -v "$PWD/searxng-tool/searxng-config:/etc/searxng" \
            searxng/searxng:latest

          echo "انتظار جاهزية SearXNG..."
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/search?q=test&format=json" > /dev/null; then
              echo "SearXNG جاهز."
              break
            fi
            sleep 2
          done

          echo "اختبار بحث حقيقي للتأكد من وجود نتائج فعلية..."
          curl -s "http://localhost:8080/search?q=facebook&format=json" | python3 -c "import json,sys; data=json.load(sys.stdin); print('عدد النتائج:', len(data.get('results', [])))"

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المتطلبات
        run: pip install requests rapidfuzz

      - name: تشغيل أداة البحث
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u searxng-tool/find_social_pages.py \
            --input "searxng-tool/${{ inputs.csv_path }}" \
            --output "results.csv" \
            --name-column "${{ inputs.name_column }}" \
            --city-column "${{ inputs.city_column }}" \
            --facebook-column "${{ inputs.facebook_column }}" \
            --instagram-column "${{ inputs.instagram_column }}" \
            --url "http://localhost:8080" \
            --delay "${{ inputs.delay }}"

      - name: رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: نتائج-البحث
          path: results.csv

      - name: إيقاف SearXNG
        if: always()
        run: docker stop searxng || true
